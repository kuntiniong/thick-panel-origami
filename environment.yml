name: pygamic
channels:
  - conda-forge
  - defaults
# optimization/framework.py uses stdlib multiprocessing (spawn on Windows); no extra package required
dependencies:
  - python=3.10
  - pip>=23.3
  - numpy<=1.26
  - pyyaml
  - scipy
  - scikit-learn
  - pip:
    - taichi>=1.7.4,<2
    - matplotlib
    - dxfgrabber
    - ezdxf
    - PyQt5
    - pyqt5-tools
    - cmaes
    - pandas
    - scikit-optimize