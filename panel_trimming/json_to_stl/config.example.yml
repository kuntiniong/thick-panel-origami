# panel_trimming/json_to_stl config example
#
#   python panel_trimming/json_to_stl/run.py
#   python panel_trimming/json_to_stl/run.py --name miura-thick-trimmed
#   python panel_trimming/json_to_stl/run.py --crease-gap 0.3 --crease-thickness 0.2
#
# Fabrication knobs (both configurable):
#   crease_gap        — mm each mountain/valley side pulls in (open gap ≈ 2×)
#   crease_thickness  — living-hinge film thickness (mm)
#                       mountain → bottom of crease height H
#                       valley   → top of H
#   strip width ≈ 2·crease_gap (bridges the open gap)
#
# Optional:
#   default_thickness — stock thickness when a panel has a single offset
#   hinge_end_inset   — inset connector ends from crease endpoints (mm)
#   export_hinges     — false to skip hinge STLs
#
# Outputs → panel_trimming/trimmedData/stl-<stem>/
#   original.stl, collision.stl, support-collision.stl,
#   final.stl, support.stl, hinges.stl (+ mountain/valley)

crease_gap: 0.3
crease_thickness: 0.2

# default_thickness: 6
# hinge_end_inset: 1.0
# export_hinges: true

jobs:
  - name: miura-thick-trimmed
  # Per-job overrides (optional):
  # - name: mountain-thick-cleaned
  #   crease_gap: 0.5
  #   crease_thickness: 0.25
