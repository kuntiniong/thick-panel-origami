# panel_trimming/json_to_stl config example
#
#   python panel_trimming/json_to_stl/run.py
#   python panel_trimming/json_to_stl/run.py --name miura-thick-trimmed
#
# Pipeline (matches visualize_3d):
#   1) panel outline from units[]
#   2) stock Z from thickness offsets (non-border crease heights + shade layer_h)
#   3) collision polys from resolve_shaded_associations (fabric/dual-curve)
#   4) extrusions (order):
#        original            = full physical panel stock
#        support             = full solid at missing global heights
#        collision           = main phys+ghost solid prism (largest ghost layer)
#        support-collision   = support solid prism (largest support layer;
#                              same clean → prism rules as main)
#        final               = original + support − both collisions
#                              (optional crease gap last)
#
# Outputs (all STLs in one folder per design):
#   panel_trimming/trimmedData/stl-<stem>/
#     original.stl
#     collision.stl
#     support-collision.stl
#     final.stl
#     support.stl
#     hinges.stl / hinges-mountain.stl / hinges-valley.stl
#     ref.stl            (final ∪ hinges — check hinge heights)

default_thickness: 6            # when panel has a single thickness offset
# thickness: 6                  # force uniform thickness (optional)

# Inset each panel edge that is a mountain/valley crease (mm).
# Border edges are not moved. Applied last on final.
crease:
  gap: 1

# Flexible TPU living hinges along mountain/valley creases.
# After final.stl: remap each panel at H as main∪support residual face,
# then hinge = faces of the two panels the crease connects. Border skipped.
# mountain → bottom face film; valley → top face film;
# face-to-face interfaces (stacked stocks) straddle H.
hinges:
  enabled: true
  thickness: 0.6    # TPU film (mm) — 0.5–0.8 typical for laser film / 95A FDM
  width: 4.0        # strip fallback only if final remap fails
  end_inset: 1.5    # inset hinge outline (mm) — shrinks faces, no vertex holes
  embed: 0.15       # bites into rigid face for bonding area

jobs:
  - name: miura-thick-trimmed
  # - name: miura-thick-cleaned
  # - name: mountain-thick-trimmed
