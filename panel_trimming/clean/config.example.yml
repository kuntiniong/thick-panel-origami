# panel_trimming/clean config example
#
# Pipeline per shaded region:
#   1) snap dual-curve samples onto creases/borders within snap_tol
#   2) round coords to round_dp
#   3) Union-Find group messy nodes (group_tol) → outermost each
#   4) convex-hull → straight_slack inflate → simplify to long straight edges
#      (never undershoot; cap overshoot via max_overshoot_ratio)
#   5) fabric_offset outward from cut polygon
#   6) merge ghost+physical per panel → continuous min→max layer_h

min_area: 0
straight_cut: true
cut_tol: 3.5              # larger → fewer, longer straight edges
straight_slack: 0.6       # outward room before simplify (anti-undershoot)
max_overshoot_ratio: 1.35 # reject expand/simplify if cut grows too much vs hull
fabric_offset: 0
group_tol: 3.0
round_dp: 6
snap_tol: 0.5             # snap samples onto M/V/border if within this mm (0=off)
uf_respect_barriers: false
merge_layer_stack: true   # per panel: ghost+main → one solid min→max height

jobs:
  - name: miura-thick-trimmed
    fabric_offset: 0.5
    group_tol: 3.0
    cut_tol: 3.5
    straight_slack: 0.6
    max_overshoot_ratio: 1.35
    round_dp: 6
    snap_tol: 0.5
    merge_layer_stack: true
