# panel_trimming/clean config example
#
# Pipeline per shaded region:
#   1) snap dual-curve samples onto creases/borders within snap_tol
#   2) round coords to round_dp
#   3) Union-Find group messy nodes (group_tol) → outermost each
#   4) convex-hull → straight_slack inflate → simplify to long straight edges
#      (never undershoot; cap overshoot via max_overshoot_ratio)
#   5) re-snap cut_ring onto creases (vertex + near-parallel edge attraction)
#   6) fabric_offset outward from cut polygon, then re-snap fabric_ring
#   7) merge per panel into continuous min→max solid prisms:
#        main    = physical + ghost (XY = largest cleaned ghost layer)
#        support = support pads     (XY = largest cleaned support layer;
#                 Z expanded to abut physical stock)
#      same rule: one largest-layer ring extruded min→max (not multi-union)

min_area: 0
straight_cut: true
cut_tol: 3.5              # larger → fewer, longer straight edges
straight_slack: 0.6       # outward room before simplify (anti-undershoot)
max_overshoot_ratio: 1.35 # reject expand/simplify if cut grows too much vs hull
fabric_offset: 0
group_tol: 3.0
round_dp: 6
# Snap samples + final cut/fabric rings onto M/V/border (mm). 0 = off.
# Raise if original − collision leaves a thin wall along the crease.
snap_tol: 1.5
uf_respect_barriers: false
merge_layer_stack: true   # per panel: main + support streams → solid prisms

jobs:
  - name: miura-thick-trimmed
    fabric_offset: 0.5
    group_tol: 3.0
    cut_tol: 3.5
    straight_slack: 0.6
    max_overshoot_ratio: 1.35
    round_dp: 6
    snap_tol: 1.5
    merge_layer_stack: true
