# Paste multiple full config blocks in this file to run them sequentially (first to last).
# Each block can start with this header comment, a top-level "algorithm:" line, or "---".

# Which optimizer to run: cma-es | bo
# Trade-off: cma-es is better for many cheap evals and larger populations;
#            bo is better when sims are expensive and dimensionality is moderate.
algorithm: bo

# Input origami JSON: name under descriptionData/ (without .json), or a relative/absolute path
# Trade-off: simpler names are easier to manage; full paths are safer when files live outside descriptionData/.
input: mountain-thick

# Seeds NumPy; also used as BO random_state fallback when bo.random_state is unset
# Trade-off: fixed seed = reproducible runs; changing seed helps check whether results are stable or stuck in local minima.
random_seed: 42

# Shared problem setup and search-space constraints (used by both cma-es and bo)
framework:
  # Number of candidate designs simulated in one Taichi run (grid layout in batch JSON)
  # Trade-off: higher = fewer sim restarts and better GPU utilization, but more VRAM/RAM and longer per batch;
  #            lower = lighter memory footprint, but more overhead from repeated simulator startup.
  batch_size: 25

  # Parallel simulator worker processes for batch evaluation (stdlib multiprocessing)
  # Trade-off: higher = faster when population exceeds batch_size (multiple batches per gen),
  #            but more RAM/CPU and separate Taichi instances per process;
  #            1 = serial (safest default); omitted defaults to min(cpu_count, 4).
  n_processes: 4

  # Candidates evaluated per iteration/generation (CMA-ES population size; BO ask batch size)
  # Trade-off: higher = better exploration per round and more stable statistics, but linearly more simulation cost;
  #            lower = cheaper iterations, but slower convergence and noisier progress curves.
  population_size: 100

  # Minimum absolute height offset in mm (valley/mountain magnitudes cannot go below this)
  # Trade-off: higher = physically thicker panels and safer folding clearance, but shrinks the feasible design space;
  #            lower = more design freedom, but may produce offsets too small to fold reliably.
  min_thickness: 2.0

  # Discretization step in mm; offsets snap to min_thickness, min_thickness+step, ...
  # Trade-off: smaller = finer resolution and better final fit, but many more effective choices and slower search;
  #            larger = faster optimization and easier manufacturing alignment, but may miss the true optimum between steps.
  discrete_step: 1.0

  # Search bound in mm; each crease is explored in [-max_offset, +max_offset] before constraints
  # Trade-off: larger = broader exploration and less risk of boundary clipping, but harder search and more wasted evals;
  #            smaller = faster focus near likely values, but can miss solutions that need larger offsets.
  max_offset: 30.0

  use_gui: false

  # Enable PCA symmetry detection and optimize in reduced independent dimensions
  # Trade-off: true = fewer DOFs and enforced symmetric offsets, faster search on symmetric patterns;
  #            false = optimize every crease independently, needed for asymmetric designs.
  symm_mode: false

# Shared optimization loop control (used by both cma-es and bo)
optimization:
  # max cap for generations
  generations: 100

  # print per-iteration progress (best fitness, offsets, etc.)
  verbose: true

# CMA-ES settings (only used when algorithm: cma-es)
cma_es:
  # Initial mutation spread in mm; controls how far offspring are sampled around the mean at the start
  # Trade-off: higher = wider early exploration and less premature convergence, but more random early evals;
  #            lower = faster local refinement, but higher risk of getting trapped near the initial guess.
  sigma_init: 10.0

# Bayesian optimization settings (only used when algorithm: bo)
bo:
  # Random points evaluated before the GP surrogate starts guiding search; null defaults to framework.population_size
  # Trade-off: higher = better surrogate fit in early rounds, but more purely random simulation cost up front;
  #            lower = quicker switch to guided search, but early GP suggestions may be unreliable on sparse data.
  # Rule of thumb: start with null; for many creases, try roughly 2-5x the number of creases.
  n_initial_points: null

  # Surrogate model: GP (default) | RF | ET | GBRT
  # Trade-off: GP = smooth, strong default for low/medium dimensions; tree models (RF/ET/GBRT) can handle
  #            less smooth objectives but may need more initial points and behave less predictably in BO.
  base_estimator: GP

  # Acquisition function: EI (expected improvement) | LCB | PI | gp_hedge
  # Trade-off: EI = balanced explore/exploit default; LCB = more exploration; PI = more exploitation;
  #            gp_hedge = adaptive mix, useful when unsure which strategy is best.
  acq_func: EI

  # BO sampler seed; falls back to random_seed when omitted
  # Trade-off: fixed seed = reproducible BO proposal sequence; changing seed tests sensitivity to proposal randomness.
  random_state: 42